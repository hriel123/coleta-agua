services:
  - type: web
    name: coleta-agua-api
    runtime: node
    region: virginia
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run deploy
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://hriel123.github.io,https://coleta-agua.onrender.com
      - key: APP_URL
        value: https://coleta-agua.onrender.com
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

  - type: web
    name: coleta-agua
    runtime: static
    buildCommand: mkdir -p publico && cp index.html privacidade.html app.css app.js publico/
    staticPublishPath: publico
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; script-src 'self' 'sha256-qSX1vni9DB4JVLXMPRMRVvfo/JpGvtvyUvLw+sEguaY=' 'sha256-hUGvntsbxkWl882hBJrdOyKQBuFg6bLodwOwx6gxYuM=' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; connect-src https://coleta-agua-api.onrender.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
