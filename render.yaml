services:
  - type: web
    name: coleta-agua-api
    runtime: node
    region: virginia
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run deploy
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://hriel123.github.io,https://coleta-agua.onrender.com
      - key: APP_URL
        value: https://coleta-agua.onrender.com
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

  - type: web
    name: coleta-agua
    runtime: static
    buildCommand: mkdir -p publico && cp index.html privacidade.html publico/
    staticPublishPath: publico
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
